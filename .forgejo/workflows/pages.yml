name: pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  publish:
    runs-on: docker
    container:
      image: python:3-bookworm
    steps:
      - name: Install Node for the checkout action
        run: apt-get update -qq && apt-get install -y --no-install-recommends nodejs

      - uses: actions/checkout@v4

      - name: Build the documentation
        run: |
          pip install --quiet -r requirements.txt
          mkdocs build --strict --site-dir _site

      - uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://${{ forge.repository_owner }}.codeberg.page/freedomnas-docs/
          token: ${{ forge.token }}
          source: _site/
